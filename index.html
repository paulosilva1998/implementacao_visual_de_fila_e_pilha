<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Manipulação de Lista</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Manipulação de Lista</h1>

    <div class="app-container">

        <div class="form-container">
            <input type="text" id="inputValor" placeholder="Digite um elemento (Ex.: Leite)" />

            <div class="buttons">
                <div class="button-group">
                    <button onclick="inserirInicio()">Inserir no início</button>
                    <button onclick="inserirFim()">Inserir no fim</button>
                    <button onclick="excluirInicio()">Excluir no início</button>
                    <button onclick="excluirFim()">Excluir no fim</button>
                </div>
                <button onclick="buscarElemento()" class="btn-buscar">Buscar elemento</button>
            </div>
        </div>
        <div id="lista" class="lista">
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
